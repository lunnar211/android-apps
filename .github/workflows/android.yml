name: Build Android APKs

# Builds a debug APK for each app and attaches all three to a
# GitHub Release whenever a version tag (v*) is pushed.
# Debug APKs install directly on a phone (allow "install unknown
# apps" once). A Play Store release build needs a signing keystore
# later — see the root README; never commit a keystore here.
# NOTE: no setup-android step on purpose — ubuntu-latest runners
# already ship the Android SDK, and setup-android@v3 fails asking
# for the long-removed "tools" SDK package.

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [leadsforcegen, pdf-tools-hub, ai-studio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and regenerate Capacitor Android files
        working-directory: apps/${{ matrix.app }}
        run: |
          npm ci
          npx cap sync android
      - name: Build debug APK
        working-directory: apps/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: apks
      - name: Rename APKs per app (release assets must have unique names)
        run: |
          for d in apks/*/; do app=$(basename "$d" | sed 's/-apk$//'); mv "$d/app-debug.apk" "$d/$app-debug.apk"; done
      - name: Create release with APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Android apps (debug APKs, direct install). LeadsForceGen, PDF Tools Hub, AI Studio — each app loads its live website, so features, login and data stay in sync with the site." \
            apks/*/*-debug.apk
